name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_NO_WARNINGS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Keep in sync with XCADDY_VERSION in the Makefile and Dockerfile.
  XCADDY_VERSION: v0.4.7

jobs:
  # --- workflow_dispatch path: compute the new version ---
  bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      new_tag: ${{ steps.bump.outputs.new }}
      current: ${{ steps.bump.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: latest
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            echo "tag=v0.0.0" >> $GITHUB_OUTPUT
          else
            echo "tag=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Compute new version
        id: bump
        env:
          CURRENT_TAG: ${{ steps.latest.outputs.tag }}
          BUMP_TYPE: ${{ github.event.inputs.bump }}
        run: |
          CURRENT="$CURRENT_TAG"
          VERSION="${CURRENT#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          if [ "$BUMP_TYPE" = "major" ]; then
            NEW="$((MAJOR + 1)).0.0"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            NEW="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=v$NEW" >> $GITHUB_OUTPUT
          echo "$CURRENT -> v$NEW"

  # --- shared test job (used by both workflows) ---
  test:
    runs-on: ubuntu-latest
    needs: [ bump ]
    if: always() && (github.event_name == 'push' || (needs.bump.result ==
      'success'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Generate test certificates
        run: make generate-certs

      - name: Run tests
        run: make test

      - name: Build with xcaddy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}
          xcaddy build --with github.com/josuebrunel/caddy-ja3ja4=.

      - name: Verify binary
        run: ./caddy version

  # --- create tag & release ---
  release:
    runs-on: ubuntu-latest
    needs: [ test, bump ]
    if: always() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        env:
          NEW_TAG: ${{ needs.bump.outputs.new_tag }}
        run: |
          if [ -n "$NEW_TAG" ]; then
            # From workflow_dispatch: use the computed tag
            TAG="$NEW_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            # From push:tags: use the pushed tag
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "Unable to determine tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Create tag
        if: needs.bump.result == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
