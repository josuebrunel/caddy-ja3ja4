services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy-ja3ja4
    ports:
      # Caddyfile.test serves https://localhost:8443 (TCP for HTTP/1.1 + HTTP/2,
      # UDP for HTTP/3).
      - "8443:8443/tcp"
      - "8443:8443/udp"
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro
      - ./testdata:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Where Caddyfile.test looks for cert.pem/key.pem (see `make generate-certs`).
      - CERT_DIR=/etc/caddy/certs
      # Keep Caddy's state on the named volumes below instead of under $HOME.
      - XDG_DATA_HOME=/data
      - XDG_CONFIG_HOME=/config
    restart: unless-stopped

  # Sends requests with different TLS/HTTP settings, so fingerprints show up in
  # the logs without needing a browser: `make docker-test`.
  client:
    image: curlimages/curl:latest
    profiles: ["tools"]
    depends_on:
      - caddy
    volumes:
      - ./scripts/test-requests.sh:/test-requests.sh:ro
    entrypoint: ["/bin/sh", "/test-requests.sh"]

volumes:
  caddy_data:
  caddy_config:
