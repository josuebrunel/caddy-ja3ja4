services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy-ja3ja4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro
      - ./testdata:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ACME_AGREE=true
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
